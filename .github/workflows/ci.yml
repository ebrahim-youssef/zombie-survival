name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit and regression tests
        run: npm test

      - name: Typecheck and production build
        run: npm run build

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Test debug controls in a production preview build
        run: npx playwright test --config playwright.prod.config.mjs

      - name: Upload playable art snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cabin-art-preview
          path: |
            test-results/cabin-art-preview.png
            test-results/character-closeups.png
            test-results/debug-hitboxes-preview.png
            test-results/aligned-hurtbox-preview.png
          retention-days: 14
          if-no-files-found: error

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug
          path: |
            test-results/
            test-results-production/
          retention-days: 5
          if-no-files-found: ignore
